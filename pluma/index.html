<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PLUMA · Correo electronico gratuito</title>

    <!-- Enlaces a las fuentes y a las hojas de estilo -->

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/estilos.css">
    <link rel="stylesheet" href="css/proporcionado.css">

</head>

<body>

    <!-- Header de la pagina -->
    <header class="topbar">

        <a class="topbar__logo" ><img src="./img/logo-pluma.svg" width="156px" height="40px" alt="PLUMA,ir a la portada"></a>
        <form class="search">
            <label for="label__search" class="search__label">Buscar</label>
            <input type="text" name="input__search" id="inp" class="search__input">
            <button class="search__btn"><img src="./img/iconos/buscar.svg" width="22px" height="22px"></button>
        </form>
        
        <nav class="account">

            <ul class="account__list">
                
                <li><a class="account__link"><img class="2try" src="./img/iconos/usuario.svg" width="24px" height="24px"></a>Registrarse</li>
                <li><a class="account__link"><img class="jojoja" src="./img/iconos/sobre.svg" width="28px" height="28px"></a>Inicio de sesion</li>

            </ul>

        </nav>

    </header>   


    <!-- Navegacion de la pagina -->
    <nav class="mainnav">

        <ul class="mainnav__list">

            <li class="mainnav__item--home"><a href="home"><img src="./img/iconos/inicio.svg" width="22px" height="22px" alt="Inicio"></a></li>
            <li class="mainnav__item"><a href="correo">Correo <img src="./img/iconos/flecha-abajo.svg" width="22px" height="22px"></a></li>
            <li class="mainnav__item"><a href="funciones">Funciones <img src="./img/iconos/flecha-abajo.svg"></a></li>
            <li class="mainnav__item"><a href="cloud">Cloud <img src="./img/iconos/flecha-abajo.svg"></a></li>
            <li class="mainnav__item"><a href="seguridad">Seguridad <img src="./img/iconos/flecha-abajo.svg"></a></li>
            <li class="mainnav__item"><a href="soporte">Soporte <img src="./img/iconos/flecha-abajo.svg"></a></li>

        </ul>

    </nav>



    <!-- Main de la pagina -->
    <main>

        <section class="login"></section>

        <section class="mail">

            <header class="mail__header"></header>

            <div class="mail__grid"></div>

        </section>

    </main>

</body>
</html>
