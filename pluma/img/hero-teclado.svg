<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 270" width="660" height="270" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Ilustración original para la portada: teclado y taza de café sobre la mesa -->
  <defs>
    <linearGradient id="mesa" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f7f7"/><stop offset="1" stop-color="#e6e6e6"/>
    </linearGradient>
    <pattern id="teclas" width="34" height="34" patternUnits="userSpaceOnUse">
      <rect x="3" y="3" width="28" height="28" rx="5" fill="#ffffff" stroke="#d4d4d4" stroke-width="1.2"/>
      <rect x="7" y="25" width="20" height="3" rx="1.5" fill="#ececec"/>
    </pattern>
    <filter id="sombra" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="6" dy="10" stdDeviation="9" flood-color="#000" flood-opacity=".18"/>
    </filter>
    <radialGradient id="cafe" cx=".45" cy=".4" r=".6">
      <stop offset="0" stop-color="#c8925f"/><stop offset=".55" stop-color="#9b6236"/><stop offset="1" stop-color="#5e3418"/>
    </radialGradient>
  </defs>
  <rect width="660" height="270" fill="url(#mesa)"/>
  <g transform="translate(250 40) rotate(-27)" filter="url(#sombra)">
    <rect x="0" y="0" width="560" height="200" rx="16" fill="#f4f4f4" stroke="#d9d9d9"/>
    <rect x="14" y="14" width="532" height="172" rx="8" fill="url(#teclas)"/>
  </g>
  <g transform="translate(395 250)" filter="url(#sombra)">
    <ellipse cx="0" cy="0" rx="82" ry="62" fill="#ffffff" stroke="#e0e0e0"/>
    <path d="M44 -18 q34 -6 34 18 q0 22 -34 16" fill="none" stroke="#f2f2f2" stroke-width="11"/>
    <circle cx="0" cy="-6" r="48" fill="#ffffff" stroke="#e3e3e3" stroke-width="2"/>
    <circle cx="0" cy="-6" r="39" fill="url(#cafe)"/>
    <path d="M-16 -14 q16 -14 32 0 q-16 10 -32 0z" fill="#e7c9a4" opacity=".55"/>
  </g>
</svg>
